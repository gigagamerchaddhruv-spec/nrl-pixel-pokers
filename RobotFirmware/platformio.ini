[platformio]
src_dir = src
default_envs = robot

[env:robot]
platform = espressif32 @ 6.9.0
board                 = esp32-s3-devkitc-1
framework             = arduino
extra_scripts         = pre:link_prebuilt.py
monitor_speed         = 115200
board_build.partitions = partitions.csv
upload_speed = 115200

; Compile opmodes/ alongside src/ — students only ever open opmodes/
build_src_filter = +<*> +<**/*> +<../opmodes/**/*>

; FreeRTOS at 1000Hz ticks — gives 1ms resolution for vTaskDelayUntil
build_unflags = -std=gnu++11 -std=c++11

build_flags =
    -DNRL_TEAM_NUMBER=205
    -DNRL_WIFI_CHANNEL=1
    "-DNRL_TEAM_NAME=\"Pixel Pokers\""
    -DCONFIG_FREERTOS_HZ=1000
    -DCORE_DEBUG_LEVEL=3
    -std=gnu++17
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

lib_deps =
    Preferences
    adafruit/Adafruit NeoPixel
    adafruit/Adafruit LSM6DS
    adafruit/Adafruit Unified Sensor

lib_extra_dirs =
    lib
    ../lib/HexaServos
    ../lib/HexaOLED
    ../lib/HexaIMU
    ../lib/HexaHAL
    ../lib/HexaLED
    ../lib/HexaPower
